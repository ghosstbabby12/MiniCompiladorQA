# ===========================================================================
# Integración Continua (CI) - MiniCompilador QA
#
# Se ejecuta en cada push y en cada pull request. Cuatro jobs:
#
#   lint ──┐
#          ├──> docker   (imagen + pruebas de contrato con docker compose)
#   tests ─┤
#          └──> sonar    (SonarCloud: bugs, code smells, duplicación, cobertura)
#
# Si CUALQUIER job falla, el commit/PR queda en rojo y no debe fusionarse.
# lint y tests corren en paralelo (feedback rápido); docker y sonar esperan a
# que ambos pasen: no tiene sentido gastar minutos en algo que ya está roto.
# ===========================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Principio de mínimo privilegio: el token de GitHub solo puede LEER el repo.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.17.5"   # misma versión que en local: mismo resultado en todas partes

jobs:
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Reglas de estilo y bugs comunes
        run: ruff check src tests --output-format=github   # anota los errores en el PR

      - name: Formato
        run: ruff format --check src tests

  # -------------------------------------------------------------------------
  tests:
    name: Tests + quality gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es la versión objetivo; 3.13 detecta a tiempo incompatibilidades futuras.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el paquete con dependencias de desarrollo
        run: pip install -e ".[dev]"

      # La configuración vive en pyproject.toml (una sola fuente de verdad):
      # --cov-fail-under=85 hace que pytest TERMINE CON ERROR si la cobertura
      # baja del 85 %. Ese es el quality gate: el job se pone rojo.
      - name: Pruebas unitarias con cobertura
        run: pytest --cov-report=xml --junitxml=reporte-pruebas.xml

      - name: Publicar reportes (cobertura HTML/XML y JUnit)
        if: always() && matrix.python-version == env.PYTHON_VERSION
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            htmlcov/
            coverage.xml
            reporte-pruebas.xml
          retention-days: 14

  # -------------------------------------------------------------------------
  sonar:
    name: SonarCloud
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # El token NUNCA va en el código: se guarda en Settings → Secrets.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sonar necesita el historial para el análisis de "código nuevo"

      - name: Descargar el reporte de cobertura del job tests
        uses: actions/download-artifact@v4
        with:
          name: reportes-pruebas

      # En forks o repos sin el secreto configurado, el análisis se omite con
      # un aviso en vez de fallar (los PR de terceros no reciben secretos).
      - name: Avisar si falta SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN no está configurado; se omite el análisis de SonarCloud."

      - name: Análisis SonarCloud (+ esperar su quality gate)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  docker:
    name: Docker + pruebas de contrato
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Levanta la API y corre el test-runner contra ella. El código de salida
      # del test-runner es el del comando: contrato roto = job rojo.
      - name: Construir imágenes y verificar el contrato de la API
        run: docker compose up --build --abort-on-container-exit --exit-code-from test-runner

      - name: Verificar que la imagen NO corre como root
        run: |
          usuario=$(docker run --rm --entrypoint id minicompilador-api:local -u)
          echo "uid del contenedor: $usuario"
          test "$usuario" != "0"

      - name: Logs de la API (solo si algo falló)
        if: failure()
        run: docker compose logs api

      - name: Limpiar
        if: always()
        run: docker compose down --volumes

  # -------------------------------------------------------------------------
  infra:
    name: Terraform + drift (LocalStack)
    needs: [lint, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: minicompiladorqa   # fija el nombre de la red que usa tf.sh
      LOCALSTACK_URL: http://localhost:4566
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test                  # credenciales ficticias de LocalStack
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias de las pruebas de infraestructura
        run: pip install "boto3>=1.34" "pytest>=8"

      - name: LocalStack + terraform apply
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml up --exit-code-from terraform terraform

      - name: terraform plan sin cambios (exit 0 = sin drift, 2 = drift)
        run: ./infra/tf.sh plan -detailed-exitcode

      - name: Pruebas de drift (provocan cambios manuales y verifican que se detectan)
        run: pytest tests/infra -o addopts="-ra" -v

      - name: Detector de drift tras las pruebas
        run: python infra/scripts/drift.py

      - name: Limpiar
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.s3.yml down --volumes
