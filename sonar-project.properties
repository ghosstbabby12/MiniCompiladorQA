# ===========================================================================
# SonarCloud - análisis estático y quality gate
#
# Al importar el repo en sonarcloud.io, la clave y la organización por
# defecto son "<usuario>_<repo>" y "<usuario>". Si las tuyas son otras,
# cámbialas aquí (deben coincidir EXACTAMENTE con las del proyecto en Sonar).
# ===========================================================================
sonar.projectKey=ghosstbabby12_MiniCompiladorQA
sonar.organization=ghosstbabby12
sonar.projectName=MiniCompilador QA

# Código y pruebas por separado: Sonar no cuenta las pruebas como "código a cubrir".
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Cobertura generada por pytest-cov en el job "tests" (pyproject: relative_files).
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reporte-pruebas.xml

# Los ejemplos .mini y los esquemas JSON no son código Python que analizar.
sonar.exclusions=**/esquemas/**

# El job espera el veredicto del quality gate de Sonar: si falla, CI en rojo.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
